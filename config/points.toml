# ============================================================================
# PLC 通讯点位表（S7-200 SMART M 区，格式 M<byte>.<bit>）
#
# ⚠️ 占位表：以下地址沿用摩洛哥双工位项目（xiezhong-Morocco-2-stations）的
#    已确认点位，仅作为结构占位。本项目电气点位表到位后，逐项替换并核对，
#    然后在 live.toml 中置 points_confirmed = true，LIVE 预检才会放行。
#
# 本项目为"每工位一台 PLC"：A 电脑的 points.toml 填 PLC A 的点位，
# B 电脑填 PLC B 的点位（各自只需本工位信号，不含对方工位）。
# ============================================================================

[points]
start        = "M16.0"   # 启动信号（PLC 硬件上升沿开周期，上位机只读）
reset        = "M0.3"    # 复位
calibration  = "M1.0"    # 校准时间到（PLC 请求样件验证）
ng_sample    = "M1.2"    # NG 样件需求
ok_sample    = "M1.3"    # OK 样件需求
manual       = "M2.0"    # 自动/手动切换
block        = "M4.2"    # 手动封堵
stamp        = "M4.6"    # 手动盖章
clamp        = "M4.4"    # 手动夹紧
transfer     = "M4.0"    # 手动移载
pressure     = "M0.5"    # 正/负压开启
door_disable = "M0.6"    # 安全门使能/禁用
laser_start  = "M20.0"   # 激光打码启动位（上位机置位脉冲，待电气确认）
laser_done   = "M20.1"   # 激光打码完成位（可选反馈，待电气确认；不用可删）
