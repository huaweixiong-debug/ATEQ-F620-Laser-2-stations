# ============================================================================
# 240429 箱体气密封机 PLC 点位表（三菱 FX，profile = "fx"）
#
# 来源：老 LabVIEW 工程 NI OPC Servers 标签（Simulation Driver Demo.opf，
# Channel2/Mitsubishi FX 驱动，2026-09-20 从 .opf 还原），老机已验证在用。
#
# ⚠️ 书写规则：FX 位元件按 byte.bit 拆分，元件号 = byte*8 + bit
#    M0=M0.0  M1=M0.1  M3=M0.3  M4=M0.4  M5=M0.5  M6=M0.6
#    M466=M58.2  M467=M58.3  M890=M111.2  M891=M111.3
#
# ✅ 2026-10-08 现场确认：A 工位激光启动位 = M888（M111.0，上位机脉冲输出，
#    PLC 程序读取该位触发 A 工位打码）。laser_done 未接线（laser_wait_done=false，
#    留空不使用）。
#
# 每台电脑实例只填本工位信号：A 电脑 = 左侧信号，B 电脑 = 右侧信号。
# 本模板为 A（左）工位；B 电脑把注释里"右侧"对应行换进来即可。
# ============================================================================

[meta]
profile = "fx"

[points]
# --- 本工位（A=左）---
start           = "M0.0"    # A 工位启动 = 左复位 M0（上升沿开周期）
result_ok       = "M0.1"    # A 工位合格 = 左合格 M1（上位机回写）
result_ng       = "M0.5"    # A 工位不合格 = 左不合格 M5（上位机回写）

# --- 激光打码（B 电脑本地写；A 电脑经中转由 B 代写）---
laser_start     = "M111.0"  # A 工位打码 = M888（现场确认）
# laser_done 未接线：laser_wait_done=false 时不使用；需要完成反馈时再填

# --- 报警（PLC->PC 只读，2 秒轮询）---
pressure_alarm  = "M110.6"  # A 工位压力开关报警 = M886（现场确认）

# --- 可选公共信号 ---
sample          = "M58.3"   # 样件模式（老 M467）
isolation_init  = "M58.2"   # 隔离箱初始化（老 M466）
shield_cylinder = "M111.3"  # A 工位屏蔽气缸 = 左屏蔽气缸 M891
# B（右）工位对照：start=M0.3(M3) result_ok=M0.4(M4) result_ng=M0.6(M6)
#                 shield_cylinder=M111.2(M890)
